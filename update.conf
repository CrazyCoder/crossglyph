# Settings for automatic release checks.
#
# Every setting is optional. The commented values below are the defaults.
#
# A check reads `latest.json`. A release download starts only when you request
# an update. See docs/updating.md.

# Set to no to stop it asking on its own. The Check now button in the preview
# and `crossglyph update --check` still work, because those are you asking.
# check          = yes

# How long to wait between checks, in hours.
# interval_hours = 24

# Versions to keep beside the active version. One allows a rollback to the
# previous release. Zero keeps only the active version.
# keep_versions  = 1
