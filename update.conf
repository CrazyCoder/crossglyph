# Whether CrossGlyph looks for a newer release, and how often.
#
# Nothing here is required. Each line below is commented out and carries the
# value the tool already uses, so uncommenting one changes nothing until you
# edit it.
#
# The check asks a small file on the web and does nothing else: it never
# downloads or installs anything. See docs/updating.md.

# Set to no to stop it asking on its own. The Check now button in the preview
# and `crossglyph update --check` still work, because those are you asking.
# check          = yes

# How long to wait between checks, in hours.
# interval_hours = 24

# How many versions to keep besides the one in use. One is what rolling back
# to the last working release needs. A version that has been run costs about
# 80 MB once uv has built its environment; zero keeps only the live one and
# leaves nothing to roll back to.
# keep_versions  = 1
