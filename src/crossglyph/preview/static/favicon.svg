  <!-- The plate under the mark is what keeps it legible on a dark tab strip.
       A single-colour glyph has to pick a side: dark enough to read on a light
       strip is dark on dark, and a `prefers-color-scheme` rule inside the file
       only helps where the icon is rendered live. Carrying its own paper means
       the contrast is the icon's own and never the browser theme's. -->
