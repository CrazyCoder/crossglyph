name: container candidate

on:
  workflow_dispatch:

env:
  CANDIDATE_IMAGE: ghcr.io/crazycoder/crossglyph-testing:candidate-${{ github.sha }}

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  candidate:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the private candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.CANDIDATE_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/CrazyCoder/crossglyph
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify the remote manifest
        shell: bash
        run: |
          docker buildx imagetools inspect "$CANDIDATE_IMAGE" --raw \
            > candidate-manifest.json
          jq -e '
            [.manifests[].platform
             | select(.os == "linux")
             | "\(.os)/\(.architecture)"] as $platforms
            | ($platforms | index("linux/amd64")) != null
              and ($platforms | index("linux/arm64")) != null
          ' candidate-manifest.json

      - name: Smoke test the pulled candidate
        shell: bash
        run: |
          workspace="$(mktemp -d)"
          trap 'docker rm -f crossglyph-candidate >/dev/null 2>&1 || true; rm -rf "$workspace"' EXIT
          mkdir "$workspace/conf"
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf "$workspace/"
          printf 'fallbacks = no\nsizes = 12\n' >"$workspace/conf/all.conf"

          docker image rm "$CANDIDATE_IMAGE" >/dev/null 2>&1 || true
          docker pull "$CANDIDATE_IMAGE"
          common=(
            --read-only --tmpfs /tmp
            --cap-drop ALL --security-opt no-new-privileges
            --user "$(id -u):$(id -g)"
            --mount "type=bind,source=$workspace,target=/workspace"
          )
          docker run --rm "${common[@]}" "$CANDIDATE_IMAGE" build
          test -n "$(find "$workspace/cpfonts" -name '*.cpfont' -print -quit)"

          docker run -d --name crossglyph-candidate "${common[@]}" \
            -p 127.0.0.1:18000:8000 "$CANDIDATE_IMAGE" preview --no-open
          for _ in {1..30}; do
            if curl --fail --silent --output /dev/null \
              http://127.0.0.1:18000/; then
              exit 0
            fi
            sleep 1
          done
          docker logs crossglyph-candidate
          exit 1
